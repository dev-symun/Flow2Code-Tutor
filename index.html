<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flow2Code Tutor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- 왼쪽 영역 -->
    <div class="left-panel">

        <div class="panel-header">
            <h2>📈 Flow Builder</h2>
            <p>내 생각이 순서도로 자라나요!</p>
        </div>

        <!-- Mermaid 순서도 -->
        <div id="diagram-container">
            <div id="diagram"></div>
        </div>

    </div>

    <!-- 오른쪽 영역 -->
    <div class="right-panel">

        <!-- 문제 영역 -->
        <div class="problem-box">

            <h2>📝 현재 문제</h2>

            <p id="problemText">
                아직 문제가 입력되지 않았습니다.
            </p>

        </div>

        <!-- AI 채팅 영역 -->
        <div class="chat-box">

            <div id="chatMessage" class="chat-message">

                <h3>🤖 Flow2Code Tutor</h3>

                <p>
                    안녕하세요! 😊
                </p>

                <p>
                    저는 Flow2Code Tutor예요.
                </p>

                <p>
                    먼저 코딩 문제를 입력해주세요.
                </p>

                <p>
                    함께 입력, 출력, 처리 과정을 찾아보면서
                    순서도를 완성해볼까요? 🚀
                </p>

            </div>

        </div>

        <!-- 입력 영역 -->
        <div class="input-box">

            <textarea
                id="userInput"
                placeholder="코딩 문제를 입력하거나 질문에 답하세요."
            ></textarea>

            <button id="submitBtn">
                전송
            </button>

        </div>

    </div>

</div>

<!-- Mermaid -->
<script type="module">

import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

window.mermaid = mermaid;

mermaid.initialize({
    startOnLoad: false,
    theme: "default",
    securityLevel: "loose"
});

</script>

<!-- 상태관리 -->
<script src="script.js"></script>

</body>
</html>
